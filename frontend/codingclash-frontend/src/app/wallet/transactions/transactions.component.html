<h2>Wallet Transactions</h2>

<table border="1" cellpadding="10">
    <thead>
        <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let tx of transactions">
            <td>{{ tx.date | date:'short' }}</td>
            <td>{{ tx.type }}</td>
            <td>₹ {{ tx.amount }}</td>
            <td>{{ tx.status }}</td>
        </tr>

    </tbody>
</table>
