<div class="max-w-md mx-auto card">

  <h2 class="text-2xl font-semibold mb-4 text-center">
    Register
  </h2>

  <form
    [formGroup]="registerForm"
    (ngSubmit)="register()"
    class="space-y-4">

    <input class="input" placeholder="Name" formControlName="name" />
    <input class="input" placeholder="Email" formControlName="email" />
    <input class="input" placeholder="Phone Number" formControlName="phone" />
    <input class="input" type="password" placeholder="Password" formControlName="password" />

    <p *ngIf="error" class="text-red-400 text-sm">
      {{ error }}
    </p>

    <button class="btn-primary w-full" type="submit">
      Create Account
    </button>
  </form>

  <p class="text-sm text-center mt-4 text-gray-400">
    Already have an account?
    <a routerLink="/auth/login" class="text-primary">Login</a>
  </p>

</div>
