<div class="max-w-4xl mx-auto">
  <h2 class="text-2xl font-bold mb-6">Coding Contests</h2>

  <div *ngFor="let contest of contests"
       class="card mb-4 p-4 flex justify-between items-center">

    <div>
      <h3 class="font-semibold">{{ contest.name }}</h3>
      <p class="text-sm text-gray-400">
        Starts at {{ contest.startTime | date:'short' }}
      </p>
    </div>

    <a class="btn-primary"
       [routerLink]="['/app/contests', contest.id]">
      View
    </a>
  </div>
</div>
