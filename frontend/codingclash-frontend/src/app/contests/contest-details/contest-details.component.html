<div class="max-w-3xl mx-auto card p-6">
  <h2 class="text-2xl font-bold mb-4">{{ contest.name }}</h2>

  <p>Status: <strong>{{ contest.state }}</strong></p>
  <p>Entry Fee: ₹{{ contest.entryFee }}</p>
  <p>Participants: {{ contest.participants }} / {{ contest.minParticipants }}</p>

  <p class="mt-4 text-sm text-red-400">
    Skill-based contest. No refund after joining.
  </p>

  <button
  class="btn-primary mt-6 w-full"
  (click)="openJoinModal()"
  [disabled]="contest.state !== 'WAITING'">

  Join Contest – ₹{{ contest.entryFee }}
</button>

</div>

<app-join-confirmation
  *ngIf="showJoinModal"
  [contest]="contest"
  (confirmJoin)="confirmJoin()"
  (cancelJoin)="cancelJoin()">
</app-join-confirmation>
