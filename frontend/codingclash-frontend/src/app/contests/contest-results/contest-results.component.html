<div class="max-w-4xl mx-auto card">

  <h2 class="text-2xl font-semibold mb-6">
    Contest Results
  </h2>

  <!-- TOP 3 WINNERS -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
    <div class="card text-center border border-yellow-400">
      🥇 <p class="font-bold">{{ results[0]?.username }}</p>
      <p class="text-primary">₹ Prize Credited</p>
    </div>

    <div class="card text-center border border-gray-400">
      🥈 <p class="font-bold">{{ results[1]?.username }}</p>
    </div>

    <div class="card text-center border border-orange-400">
      🥉 <p class="font-bold">{{ results[2]?.username }}</p>
    </div>
  </div>

  <!-- LEADERBOARD -->
  <table class="table-base">
    <thead>
      <tr>
        <th>Rank</th>
        <th>User</th>
        <th>Score</th>
        <th>Time (sec)</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let r of results">
        <td>{{ r.rank }}</td>
        <td>{{ r.username }}</td>
        <td>{{ r.score }}</td>
        <td>{{ r.timeTaken }}</td>
      </tr>
    </tbody>
  </table>

</div>
