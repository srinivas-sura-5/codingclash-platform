<!-- PUBLIC NAV -->
<ul *ngIf="!isLoggedIn">
  <li><a routerLink="/auth/login">Login</a></li>
  <li><a routerLink="/auth/register">Register</a></li>
</ul>

<!-- APP NAV -->
<ul *ngIf="isLoggedIn">
  <li><a routerLink="/app/home">Home</a></li>
  <li><a routerLink="/app/wallet">Wallet</a></li>
  <li><a routerLink="/app/profile">Profile</a></li>
  <li><button (click)="logout()">Logout</button></li>
</ul>
