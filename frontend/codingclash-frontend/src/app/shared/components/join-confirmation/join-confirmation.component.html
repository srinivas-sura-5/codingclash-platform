<div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
  <div class="card w-full max-w-md p-6">

    <h3 class="text-xl font-semibold mb-4">Confirm Join</h3>

    <p><strong>{{ contest.name }}</strong></p>
    <p>Entry Fee: ₹{{ contest.entryFee }}</p>
    <p>Starts: {{ contest.startTime | date:'short' }}</p>

    <p class="text-xs text-red-400 mt-3">
      Entry fee once deducted is non-refundable.<br>
      Skill-based contest.
    </p>

    <div class="flex gap-3 mt-6">
      <button class="btn-secondary w-1/2" (click)="cancelJoin.emit()">
        Cancel
      </button>
      <button class="btn-primary w-1/2" (click)="confirmJoin.emit()">
        Confirm
      </button>
    </div>

  </div>
</div>
